<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파스텔 방송 스케줄러</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f7f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333333;
      padding: 30px 20px;
    }

    /* 메인 컨테이너 */
    .calendar-container {
      background-color: #ffffff;
      padding: 32px 36px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 1100px;
    }

    /* 상단 네비게이션 & 로그인 바 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .calendar-controller {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn {
      background: none;
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      color: #555555;
      transition: background-color 0.2s;
    }

    .nav-btn:hover {
      background-color: #f0f4f8;
    }

    .select-group {
      display: flex;
      gap: 8px;
    }

    select {
      padding: 8px 12px;
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      background-color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      color: #333333;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: #5B92E5;
    }

    /* 로그인/로그아웃 버튼 */
    .auth-btn {
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #e1e4e8;
      background-color: #ffffff;
      color: #555555;
      transition: all 0.2s;
    }

    .auth-btn.logged-in {
      background-color: #2D3748;
      color: #ffffff;
      border-color: #2D3748;
    }

    .auth-btn:hover {
      opacity: 0.9;
    }

    /* 요일 헤더 */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f0f0f0;
    }

    .sun { color: #EA7B7B; }
    .sat { color: #5B92E5; }

    /* 날짜 그리드 */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-template-rows: repeat(6, 110px);
      gap: 10px;
      margin-bottom: 24px;
    }

    /* 날짜 셀 */
    .day {
      height: 110px;
      width: 100%;
      background-color: #ffffff;
      border: 1px solid #eef0f3;
      border-radius: 12px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      user-select: none;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .day:hover:not(.empty) {
      border-color: #5B92E5;
    }

    .day.empty {
      background-color: #ffffff;
      border: none;
      cursor: default;
      pointer-events: none;
    }

    .day-number {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    .day.selected {
      outline: 2px solid #2D3748;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      z-index: 1;
    }

    /* 상태별 배경색 */
    .day.status-on {
      background-color: #FFEAEA;
      border-color: #FFD5D5;
    }

    .day.status-off {
      background-color: #EDEDED;
      border-color: #DBDBDB;
    }

    .day.status-none {
      background-color: #FFFFFF;
    }

    /* 일정 콘텐츠 영역 */
    .schedule-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 3px;
      font-size: 11px;
      line-height: 1.25;
      overflow: hidden;
      width: 100%;
    }

    .schedule-item-line {
      display: grid;
      grid-template-columns: 34px 1fr;
      align-items: baseline;
      gap: 4px;
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .schedule-time-tag {
      font-size: 10.5px;
      font-weight: 700;
      color: #2D3748;
      white-space: nowrap;
      text-align: left;
    }

    .schedule-text-tag {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      color: #222222;
    }

    .off-label {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #666666;
    }

    /* 하단 편집 영역 (비로그인 시 숨김) */
    .edit-section {
      border-top: 1px solid #f0f0f0;
      padding-top: 20px;
      display: none; /* 기본 숨김 */
    }

    .edit-section.active {
      display: block; /* 관리자 로그인 시 활성화 */
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: #2D3748;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .status-options {
      display: flex;
      gap: 14px;
    }

    .status-option {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      cursor: pointer;
    }

    .memo-list-editor {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .memo-editor-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #fafbfc;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #edf0f2;
    }

    .memo-label {
      font-size: 13px;
      font-weight: 700;
      color: #4A5568;
      width: 45px;
      flex-shrink: 0;
    }

    .time-picker-set {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .time-picker-set label {
      font-size: 12.5px;
      font-weight: 600;
      color: #555555;
    }

    .time-picker-set select {
      padding: 4px 8px;
      font-size: 12.5px;
      font-weight: normal;
      border-radius: 6px;
    }

    .direct-time-input {
      width: 75px;
      padding: 4px 8px;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      font-size: 12.5px;
      outline: none;
    }

    .memo-text-input {
      flex: 1;
      padding: 6px 12px;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .memo-text-input:focus, .direct-time-input:focus, .time-picker-set select:focus {
      border-color: #5B92E5;
    }

    .btn-reset {
      padding: 5px 12px;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      background-color: #f7f9fa;
      border: 1px solid #e1e4e8;
      color: #EA7B7B;
      transition: background-color 0.2s;
    }

    .btn-reset:hover {
      background-color: #fff5f5;
    }
  </style>
</head>
<body>

  <div class="calendar-container">
    <!-- 상단 컨트롤러 및 로그인 버튼 -->
    <div class="top-bar">
      <div class="calendar-controller">
        <button class="nav-btn" id="prevBtn" title="이전 달">&lt;</button>
        <div class="select-group">
          <select id="yearSelect"></select>
          <select id="monthSelect"></select>
        </div>
        <button class="nav-btn" id="nextBtn" title="다음 달">&gt;</button>
      </div>

      <button class="auth-btn" id="authBtn">관리자 로그인</button>
    </div>

    <!-- 요일 헤더 -->
    <div class="weekdays">
      <div class="sun">일</div>
      <div>월</div>
      <div>화</div>
      <div>수</div>
      <div>목</div>
      <div>금</div>
      <div class="sat">토</div>
    </div>

    <!-- 날짜 그리드 -->
    <div class="days-grid" id="daysContainer"></div>

    <!-- 하단 편집 섹션 (관리자 로그인 시 표시) -->
    <div class="edit-section" id="editSection">
      <div class="section-header">
        <div class="section-title" id="selectedDateTitle">날짜를 선택하세요</div>
        <button class="btn-reset" id="resetBtn">일정 초기화</button>
      </div>
      
      <!-- 상태 라디오 -->
      <div class="status-row">
        <div class="status-options">
          <label class="status-option">
            <input type="radio" name="broadcastStatus" value="none" checked> None
          </label>
          <label class="status-option">
            <input type="radio" name="broadcastStatus" value="on"> 방송 ON
          </label>
          <label class="status-option">
            <input type="radio" name="broadcastStatus" value="off"> 방송 OFF
          </label>
        </div>
      </div>

      <!-- 메모 1~3 에디터 -->
      <div class="memo-list-editor">
        <div class="memo-editor-row" data-index="0">
          <span class="memo-label">메모 1</span>
          <div class="time-picker-set">
            <label>시간:</label>
            <select class="hour-select"><option value="">선택</option></select>
            <select class="min-select"><option value="00">00분</option><option value="30">30분</option></select>
            <input type="text" class="direct-time-input" placeholder="직접입력">
          </div>
          <input type="text" class="memo-text-input" placeholder="첫 번째 일정 내용">
        </div>

        <div class="memo-editor-row" data-index="1">
          <span class="memo-label">메모 2</span>
          <div class="time-picker-set">
            <label>시간:</label>
            <select class="hour-select"><option value="">선택</option></select>
            <select class="min-select"><option value="00">00분</option><option value="30">30분</option></select>
            <input type="text" class="direct-time-input" placeholder="직접입력">
          </div>
          <input type="text" class="memo-text-input" placeholder="두 번째 일정 내용">
        </div>

        <div class="memo-editor-row" data-index="2">
          <span class="memo-label">메모 3</span>
          <div class="time-picker-set">
            <label>시간:</label>
            <select class="hour-select"><option value="">선택</option></select>
            <select class="min-select"><option value="00">00분</option><option value="30">30분</option></select>
            <input type="text" class="direct-time-input" placeholder="직접입력">
          </div>
          <input type="text" class="memo-text-input" placeholder="세 번째 일정 내용">
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK 모듈 로드 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // -------------------------------------------------------------
    // [중요] 아래 설정값을 본인의 Firebase 콘솔 설정값으로 교체하세요.
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const TOTAL_SLOTS = 42;

    const state = {
      year: new Date().getFullYear(),
      month: new Date().getMonth() + 1,
      selectedDays: new Set([new Date().getDate()]),
      lastAnchorDay: new Date().getDate(),
      currentUser: null,
      schedules: {} // 실시간 Firestore 데이터 캐시 (Key: YYYY-MM-DD)
    };

    const yearSelect = document.getElementById('yearSelect');
    const monthSelect = document.getElementById('monthSelect');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const authBtn = document.getElementById('authBtn');
    const editSection = document.getElementById('editSection');
    const daysContainer = document.getElementById('daysContainer');
    const selectedDateTitle = document.getElementById('selectedDateTitle');
    const resetBtn = document.getElementById('resetBtn');
    const statusRadios = document.querySelectorAll('input[name="broadcastStatus"]');
    const memoRows = document.querySelectorAll('.memo-editor-row');

    function getDateDocKey(year, month, day) {
      const formattedMonth = String(month).padStart(2, '0');
      const formattedDay = String(day).padStart(2, '0');
      return `${year}-${formattedMonth}-${formattedDay}`;
    }

    function getDateData(year, month, day) {
      const key = getDateDocKey(year, month, day);
      return state.schedules[key] || {
        status: 'none',
        items: [
          { time: '', text: '' },
          { time: '', text: '' },
          { time: '', text: '' }
        ]
      };
    }

    // 초기화
    function init() {
      populateYearOptions(1990, 2040);
      populateMonthOptions();

      memoRows.forEach(row => {
        const hourSel = row.querySelector('.hour-select');
        for (let h = 10; h <= 20; h++) {
          const opt = document.createElement('option');
          opt.value = String(h).padStart(2, '0');
          opt.textContent = `${h}시`;
          hourSel.appendChild(opt);
        }

        const minSel = row.querySelector('.min-select');
        const directInput = row.querySelector('.direct-time-input');
        const textInput = row.querySelector('.memo-text-input');

        hourSel.addEventListener('change', () => handleDropdownChange(row));
        minSel.addEventListener('change', () => handleDropdownChange(row));
        directInput.addEventListener('input', () => handleDirectInputChange(row));
        textInput.addEventListener('input', autoSaveData);
      });

      syncSelectsWithState();
      renderCalendar();

      // 이벤트 바인딩
      yearSelect.addEventListener('change', handleYearChange);
      monthSelect.addEventListener('change', handleMonthChange);
      prevBtn.addEventListener('click', handlePrevMonth);
      nextBtn.addEventListener('click', handleNextMonth);
      authBtn.addEventListener('click', handleAuthToggle);
      statusRadios.forEach(radio => radio.addEventListener('change', autoSaveData));
      resetBtn.addEventListener('click', handleResetData);

      // 1. Firebase Auth 로그인 상태 감지
      onAuthStateChanged(auth, user => {
        state.currentUser = user;
        if (user) {
          authBtn.textContent = "로그아웃";
          authBtn.classList.add('logged-in');
          editSection.classList.add('active');
        } else {
          authBtn.textContent = "관리자 로그인";
          authBtn.classList.remove('logged-in');
          editSection.classList.remove('active');
        }
      });

      // 2. Firestore 실시간 데이터 구독 (모든 사용자에게 실시간 반영)
      onSnapshot(collection(db, "schedules"), snapshot => {
        const newSchedules = {};
        snapshot.forEach(doc => {
          newSchedules[doc.id] = doc.data();
        });
        state.schedules = newSchedules;
        renderCalendar();
        loadSelectedDatesData();
      });
    }

    // 로그인 / 로그아웃 처리
    async function handleAuthToggle() {
      if (state.currentUser) {
        await signOut(auth);
      } else {
        const email = prompt("관리자 이메일을 입력하세요:");
        if (!email) return;
        const password = prompt("비밀번호를 입력하세요:");
        if (!password) return;

        try {
          await signInWithEmailAndPassword(auth, email.trim(), password);
        } catch (error) {
          alert("로그인 실패: 이메일 또는 비밀번호가 일치하지 않습니다.");
        }
      }
    }

    function populateYearOptions(startYear, endYear) {
      for (let y = startYear; y <= endYear; y++) {
        const option = document.createElement('option');
        option.value = y;
        option.textContent = `${y}년`;
        yearSelect.appendChild(option);
      }
    }

    function populateMonthOptions() {
      for (let m = 1; m <= 12; m++) {
        const option = document.createElement('option');
        option.value = m;
        option.textContent = `${m}월`;
        monthSelect.appendChild(option);
      }
    }

    function syncSelectsWithState() {
      yearSelect.value = state.year;
      monthSelect.value = state.month;
    }

    function getDaysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    // 날짜 클릭 (Ctrl / Shift 지원)
    function handleDayClick(e, dayNum) {
      const isCtrlOrCmd = e.ctrlKey || e.metaKey;
      const isShift = e.shiftKey;

      if (isShift && state.lastAnchorDay !== null) {
        const start = Math.min(state.lastAnchorDay, dayNum);
        const end = Math.max(state.lastAnchorDay, dayNum);
        
        if (!isCtrlOrCmd) state.selectedDays.clear();
        for (let i = start; i <= end; i++) {
          state.selectedDays.add(i);
        }
      } else if (isCtrlOrCmd) {
        if (state.selectedDays.has(dayNum)) {
          state.selectedDays.delete(dayNum);
          if (state.selectedDays.size === 0) state.selectedDays.add(dayNum);
        } else {
          state.selectedDays.add(dayNum);
        }
        state.lastAnchorDay = dayNum;
      } else {
        state.selectedDays.clear();
        state.selectedDays.add(dayNum);
        state.lastAnchorDay = dayNum;
      }

      renderCalendar();
      loadSelectedDatesData();
    }

    function renderCalendar() {
      daysContainer.innerHTML = '';

      const firstDayIndex = new Date(state.year, state.month - 1, 1).getDay();
      const totalDays = getDaysInMonth(state.year, state.month);

      const validSelected = new Set();
      state.selectedDays.forEach(d => {
        if (d <= totalDays) validSelected.add(d);
      });
      if (validSelected.size === 0) validSelected.add(1);
      state.selectedDays = validSelected;

      // 이전 달 빈칸
      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day empty';
        daysContainer.appendChild(emptyCell);
      }

      // 날짜 셀 렌더링
      for (let d = 1; d <= totalDays; d++) {
        const dayCell = document.createElement('div');
        dayCell.className = 'day';

        const data = getDateData(state.year, state.month, d);

        const tooltipLines = [];
        data.items.forEach(item => {
          if (item.time || item.text) {
            tooltipLines.push(`${item.time ? item.time + ' ' : ''}${item.text || ''}`);
          }
        });
        if (tooltipLines.length > 0) {
          dayCell.title = tooltipLines.join('\n');
        }

        if (data.status === 'on') dayCell.classList.add('status-on');
        else if (data.status === 'off') dayCell.classList.add('status-off');
        else dayCell.classList.add('status-none');

        const dayOfWeek = new Date(state.year, state.month - 1, d).getDay();
        const numberDiv = document.createElement('div');
        numberDiv.className = 'day-number';
        if (dayOfWeek === 0) numberDiv.classList.add('sun');
        if (dayOfWeek === 6) numberDiv.classList.add('sat');
        numberDiv.textContent = d;
        dayCell.appendChild(numberDiv);

        const contentDiv = document.createElement('div');
        contentDiv.className = 'schedule-content';

        if (data.status === 'off') {
          const offDiv = document.createElement('div');
          offDiv.className = 'off-label';
          const firstMemo = data.items[0] ? data.items[0].text : '';
          offDiv.textContent = firstMemo ? firstMemo : '휴방';
          contentDiv.appendChild(offDiv);
        } else {
          data.items.forEach(item => {
            if (item.time || item.text) {
              const line = document.createElement('div');
              line.className = 'schedule-item-line';

              const timeSpan = document.createElement('span');
              timeSpan.className = 'schedule-time-tag';
              timeSpan.textContent = item.time || '';

              const textSpan = document.createElement('span');
              textSpan.className = 'schedule-text-tag';
              textSpan.textContent = item.text || '';

              line.appendChild(timeSpan);
              line.appendChild(textSpan);
              contentDiv.appendChild(line);
            }
          });
        }

        dayCell.appendChild(contentDiv);

        if (state.selectedDays.has(d)) {
          dayCell.classList.add('selected');
        }

        dayCell.addEventListener('click', (e) => handleDayClick(e, d));
        daysContainer.appendChild(dayCell);
      }

      // 다음 달 빈칸
      const currentRenderedSlots = firstDayIndex + totalDays;
      const remainingSlots = TOTAL_SLOTS - currentRenderedSlots;

      for (let j = 0; j < remainingSlots; j++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day empty';
        daysContainer.appendChild(emptyCell);
      }
    }

    function loadSelectedDatesData() {
      const selectedArray = Array.from(state.selectedDays).sort((a, b) => a - b);
      
      if (selectedArray.length === 1) {
        selectedDateTitle.textContent = `${state.year}년 ${state.month}월 ${selectedArray[0]}일 일정 편집`;
      } else {
        selectedDateTitle.textContent = `${state.year}년 ${state.month}월 (총 ${selectedArray.length}개 날짜 일괄 편집)`;
      }

      const anchorDay = state.lastAnchorDay || selectedArray[0];
      const data = getDateData(state.year, state.month, anchorDay);
      
      const radio = document.querySelector(`input[name="broadcastStatus"][value="${data.status}"]`);
      if (radio) radio.checked = true;

      memoRows.forEach((row, idx) => {
        const item = data.items[idx] || { time: '', text: '' };
        const hourSel = row.querySelector('.hour-select');
        const minSel = row.querySelector('.min-select');
        const directInput = row.querySelector('.direct-time-input');
        const textInput = row.querySelector('.memo-text-input');

        directInput.value = item.time || '';
        syncDropdownFromText(hourSel, minSel, item.time || '');
        textInput.value = item.text || '';
      });
    }

    function syncDropdownFromText(hourSel, minSel, timeStr) {
      if (timeStr && timeStr.includes(':')) {
        const [h, m] = timeStr.split(':');
        if (parseInt(h, 10) >= 10 && parseInt(h, 10) <= 20) {
          hourSel.value = h;
          minSel.value = (m === '30') ? '30' : '00';
          return;
        }
      }
      hourSel.value = '';
      minSel.value = '00';
    }

    function handleDropdownChange(row) {
      if (!state.currentUser) return;
      const hourSel = row.querySelector('.hour-select');
      const minSel = row.querySelector('.min-select');
      const directInput = row.querySelector('.direct-time-input');

      if (hourSel.value) {
        directInput.value = `${hourSel.value}:${minSel.value}`;
      } else {
        directInput.value = '';
      }
      autoSaveData();
    }

    function handleDirectInputChange(row) {
      if (!state.currentUser) return;
      const hourSel = row.querySelector('.hour-select');
      const minSel = row.querySelector('.min-select');
      const directInput = row.querySelector('.direct-time-input');

      syncDropdownFromText(hourSel, minSel, directInput.value.trim());
      autoSaveData();
    }

    // Firestore 실시간 자동 저장
    async function autoSaveData() {
      if (!state.currentUser) return;

      const selectedRadio = document.querySelector('input[name="broadcastStatus"]:checked');
      const status = selectedRadio ? selectedRadio.value : 'none';

      const items = [];
      let hasData = false;

      memoRows.forEach(row => {
        const directInput = row.querySelector('.direct-time-input');
        const textInput = row.querySelector('.memo-text-input');

        const time = directInput.value.trim();
        const text = textInput.value.trim();

        if (time || text) hasData = true;
        items.push({ time, text });
      });

      const promises = Array.from(state.selectedDays).map(day => {
        const docId = getDateDocKey(state.year, state.month, day);
        const docRef = doc(db, "schedules", docId);

        if (status === 'none' && !hasData) {
          return deleteDoc(docRef);
        } else {
          return setDoc(docRef, { status, items });
        }
      });

      await Promise.all(promises);
    }

    // Firestore 실시간 데이터 초기화
    async function handleResetData() {
      if (!state.currentUser) return;

      const promises = Array.from(state.selectedDays).map(day => {
        const docId = getDateDocKey(state.year, state.month, day);
        return deleteDoc(doc(db, "schedules", docId));
      });

      await Promise.all(promises);

      document.querySelector('input[name="broadcastStatus"][value="none"]').checked = true;
      memoRows.forEach(row => {
        row.querySelector('.hour-select').value = '';
        row.querySelector('.min-select').value = '00';
        row.querySelector('.direct-time-input').value = '';
        row.querySelector('.memo-text-input').value = '';
      });
    }

    function handlePrevMonth() {
      state.month--;
      if (state.month < 1) {
        state.month = 12;
        state.year--;
      }
      state.selectedDays = new Set([1]);
      state.lastAnchorDay = 1;
      syncSelectsWithState();
      renderCalendar();
      loadSelectedDatesData();
    }

    function handleNextMonth() {
      state.month++;
      if (state.month > 12) {
        state.month = 1;
        state.year++;
      }
      state.selectedDays = new Set([1]);
      state.lastAnchorDay = 1;
      syncSelectsWithState();
      renderCalendar();
      loadSelectedDatesData();
    }

    function handleYearChange(e) {
      state.year = parseInt(e.target.value, 10);
      renderCalendar();
      loadSelectedDatesData();
    }

    function handleMonthChange(e) {
      state.month = parseInt(e.target.value, 10);
      renderCalendar();
      loadSelectedDatesData();
    }

    init();
  </script>
</body>
</html>
