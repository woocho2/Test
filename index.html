<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다정현네 체리창고</title>
    
    <style>
        /* [전체 페이지 배경 및 정렬] */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fff0f3;
            color: #4a4a4a;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* [공통 카드 컨테이너 스타일] */
        .container, .board-card {
            background: #ffffff;
            max-width: 900px;
            width: 100%;
            padding: 35px 40px;
            border-radius: 20px;
            border: 1px solid #ffccd5;
            box-shadow: 0 8px 20px rgba(255, 117, 143, 0.12);
            box-sizing: border-box;
        }

        .container {
            text-align: center;
        }

        /* [상단 배너/프로필 이미지] */
        .profile-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 20px;
            border-radius: 16px;
            border: 4px solid #ff758f;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #c9184a;
        }

        /* [도장판 헤더 영역] */
        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #fff0f3;
        }

        .board-title {
            font-size: 20px;
            font-weight: bold;
            color: #c9184a;
            margin: 0;
        }

        .board-badge {
            font-size: 13px;
            font-weight: bold;
            color: #ff4d6d;
            background-color: #fff0f3;
            padding: 6px 12px;
            border-radius: 20px;
        }

        /* [도장판 30칸 그리드 (가로 10칸)] */
        .stamp-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
        }

        /* 모바일 대응 (가로 5칸) */
        @media (max-width: 768px) {
            .stamp-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        /* [도장 기본 상태 (미달성 회색 칸)] */
        .stamp-btn {
            position: relative;
            aspect-ratio: 1 / 1;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            transition: all 0.15s ease-in-out;
            overflow: hidden; /* 이미지가 모서리 밖으로 나가지 않도록 방지 */
        }

        .stamp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* [도장 칸 내부의 Jerry 이미지 스타일] */
        .stamp-icon {
            width: 70%;
            height: 70%;
            object-fit: contain; /* 비율 유지하며 칸 안에 쏙 들어가게 맞춤 */
            pointer-events: none; /* 클릭 방해 방지 */
        }

        /* [도장 획득 상태 (일반 - 분홍색)] */
        .stamp-btn.active {
            background-color: #ffe5ec;
            border-color: #ff8fa3;
        }

        /* [도장 획득 상태 (3의 배수 보상 칸 - 초코색)] */
        .stamp-btn.active.special {
            background-color: #ede0d4;
            border-color: #b08968;
        }

        /* 도장 번호 라벨 */
        .stamp-number {
            position: absolute;
            bottom: 3px;
            right: 5px;
            font-size: 10px;
            color: #888888;
            font-weight: 500;
        }

        /* [상세 정보 모달 팝업] */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-box {
            background: #ffffff;
            max-width: 420px;
            width: 100%;
            border-radius: 18px;
            padding: 28px;
            border: 1px solid #ffccd5;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            box-sizing: border-box;
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            color: #c9184a;
            margin-bottom: 6px;
        }

        .modal-date {
            font-size: 13px;
            color: #888888;
            margin-bottom: 16px;
        }

        .modal-info {
            font-size: 15px;
            color: #444444;
            line-height: 1.6;
            margin-bottom: 24px;
            background-color: #fff0f3;
            padding: 14px;
            border-radius: 10px;
            text-align: left;
        }

        .modal-link-btn {
            display: inline-block;
            background-color: #ff758f;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            width: calc(100% - 48px);
            margin-bottom: 10px;
            transition: background-color 0.2s;
        }

        .modal-link-btn:hover {
            background-color: #ff4d6d;
        }

        .modal-close-btn {
            background: none;
            border: none;
            color: #888888;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- 1. 상단 프로필/배너 메인 카드 -->
    <div class="container">
        <img src="my-image.png" alt="프로필 사진" class="profile-img">
        <h1>다정현네 체리창고</h1>
        <p style="margin: 0; color: #666; font-size: 16px;">원하는 도장을 클릭하여 상세 클립 정보를 확인하세요.</p>
    </div>

    <!-- 2. 아래로 생성될 20개의 도장판 영역 -->
    <div id="boards-container" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 28px;"></div>

    <!-- 3. 도장 클릭 시 노출되는 모달 창 -->
    <div class="modal-overlay" id="info-modal" onclick="closeModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header" id="modal-title">[ 1번 도장 ]</div>
            <div class="modal-date" id="modal-date">날짜: 2026-08-01</div>
            <div class="modal-info" id="modal-desc">간단한 정보가 표시됩니다.</div>
            <a href="#" id="modal-link" target="_blank" class="modal-link-btn">영상 바로가기</a>
            <br>
            <button class="modal-close-btn" onclick="closeModalDirect()">닫기</button>
        </div>
    </div>

    <!-- [스크립트 로직] -->
    <script>
        const totalBoards = 20;     // 생성할 총 도장판 개수
        const stampsPerBoard = 30;   // 각 판당 칸 수

        // [도장판별 활성화 개수 설정]
        const boardActiveCounts = {
            1: 3,
            2: 1,
            3: 0
        };

        // 20개 도장판 생성 함수
        function initBoards() {
            const container = document.getElementById("boards-container");
            container.innerHTML = "";

            for (let b = 1; b <= totalBoards; b++) {
                const card = document.createElement("div");
                card.className = "board-card";

                const activeCount = boardActiveCounts[b] || 0;

                // 상단 타이틀 및 달성 배지
                const header = document.createElement("div");
                header.className = "board-header";
                header.innerHTML = `
                    <h2 class="board-title">도장판 #${b}</h2>
                    <span class="board-badge">도장 ${activeCount} / ${stampsPerBoard}개</span>
                `;
                card.appendChild(header);

                // 도장 그리드 생성
                const grid = document.createElement("div");
                grid.className = "stamp-grid";

                for (let s = 1; s <= stampsPerBoard; s++) {
                    const btn = document.createElement("button");
                    btn.className = "stamp-btn";

                    // 3의 배수는 special 클래스 부여
                    if (s % 3 === 0) {
                        btn.classList.add("special");
                    }

                    // 활성화 번호 이하는 Jerry 이미지 출력
                    if (s <= activeCount) {
                        btn.classList.add("active");
                        btn.innerHTML = `<img src="Jerry.png" alt="도장" class="stamp-icon"><span class="stamp-number">${s}</span>`;
                    } else {
                        btn.innerHTML = `<span class="stamp-number">${s}</span>`;
                    }

                    btn.onclick = () => openModal(b, s);
                    grid.appendChild(btn);
                }

                card.appendChild(grid);
                container.appendChild(card);
            }
        }

        // 모달 데이터 노출
        function openModal(boardIndex, stampIndex) {
            document.getElementById("modal-title").textContent = `[ 도장판 #${boardIndex} - ${stampIndex}번 도장 ]`;
            document.getElementById("modal-date").textContent = `날짜: 2026-08-${stampIndex < 10 ? '0' + stampIndex : stampIndex}`;
            document.getElementById("modal-desc").textContent = `${boardIndex}번째 판의 ${stampIndex}번 도장 상세 안내 정보입니다.`;
            document.getElementById("modal-link").href = "https://youtube.com";

            document.getElementById("info-modal").style.display = "flex";
        }

        // 모달 닫기
        function closeModal(event) {
            if (event.target.id === "info-modal") {
                document.getElementById("info-modal").style.display = "none";
            }
        }

        function closeModalDirect() {
            document.getElementById("info-modal").style.display = "none";
        }

        window.addEventListener("DOMContentLoaded", initBoards);
    </script>
</body>
</html>
