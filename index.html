<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단한 소개 웹사이트</title>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fff0f3;
            color: #4a4a4a;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            max-width: 500px;
            width: 100%;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #ffccd5;
            box-shadow: 0 8px 20px rgba(255, 117, 143, 0.15);
            text-align: center;
        }

        /* [추가] 이미지 스타일 */
        .profile-img {
            width: 150px;           /* 이미지 가로 너비 */
            height: 150px;          /* 이미지 세로 높이 */
            object-fit: cover;      /* 비율 유지하며 영역 채우기 */
            border-radius: 50%;     /* 50%로 설정 시 동그란 원형으로 표시 */
            border: 3px solid #ff758f; /* 핑크색 테두리 */
            margin-bottom: 16px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #c9184a;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #595959;
            margin-bottom: 24px;
        }

        .action-button {
            background-color: #ff758f;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .action-button:hover {
            background-color: #ff4d6d;
        }

        .action-button:active {
            transform: scale(0.98);
        }

        #result-text {
            margin-top: 20px;
            font-size: 16px;
            font-weight: 600;
            color: #a4133c;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 
            [이미지 태그 추가]
            저장소에 올린 파일명이 my-image.png 라면 src="my-image.png" 로 변경하세요.
        -->
        <img src="my-image.png" alt="프로필 사진" class="profile-img">

        <h1>안녕하세요</h1>
        <p>간단한 HTML, CSS, JavaScript로 구성된 단일 페이지 웹사이트입니다.</p>
        
        <button class="action-button" onclick="handleButtonClick()">클릭해보기</button>
        
        <div id="result-text"></div>
    </div>

    <script>
        let clickCount = 0;

        function handleButtonClick() {
            clickCount += 1;
            const outputElement = document.getElementById("result-text");
            outputElement.textContent = `버튼을 ${clickCount}번 클릭했습니다.`;
        }
    </script>
</body>
</html>
