<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다정현 핫클립 저장소</title>
    
    <style>
        /* [전체 페이지 배경 및 정렬] */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fff0f3;
            color: #4a4a4a;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            box-sizing: border-box;
        }

        /* [공통 카드 컨테이너 스타일] */
        .container, .board-card, .goods-card {
            background: #ffffff;
            max-width: 1100px;
            width: 100%;
            padding: 35px 40px;
            border-radius: 20px;
            border: 1px solid #ffccd5;
            box-shadow: 0 8px 20px rgba(255, 117, 143, 0.12);
            box-sizing: border-box;
        }

        .container {
            text-align: center;
        }

        /* [상단 배너 이미지] */
        .profile-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 20px;
            border-radius: 16px;
            border: 4px solid #ff758f;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #c9184a;
        }

        /* =======================================
           [굿즈 안내 박스 스타일]
        ======================================= */
        .goods-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .goods-title {
            font-size: 20px;
            font-weight: bold;
            color: #c9184a;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .goods-badge-pink {
            font-size: 12px;
            font-weight: bold;
            color: #c9184a;
            background-color: #fff0f3;
            border: 1px solid #ffccd5;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .goods-description {
            font-size: 14px;
            color: #4b5563;
            line-height: 1.7;
            margin: 0 0 20px 0;
        }

        .goods-description b {
            color: #c9184a;
        }

        .goods-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .goods-item {
            background: #ffffff;
            border: 1px solid #ffe5ec;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            text-align: left;
            transition: transform 0.15s ease-in-out, box-shadow 0.15s;
        }

        .goods-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(255, 117, 143, 0.15);
            border-color: #ffccd5;
        }

        .goods-img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #fffafb;
            border: 1px solid #fff0f3;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .goods-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .goods-badge-no {
            align-self: flex-start;
            font-size: 11px;
            font-weight: bold;
            color: #c9184a;
            background-color: #ffe5ec;
            padding: 2px 8px;
            border-radius: 12px;
            margin-bottom: 6px;
        }

        .goods-badge-no.special {
            color: #6f4518;
            background-color: #ede0d4;
            border: 1px solid #b08968;
        }

        .goods-name {
            font-size: 14px;
            font-weight: bold;
            color: #111827;
            margin: 0 0 4px 0;
            line-height: 1.3;
        }

        .goods-info {
            font-size: 11px;
            color: #6b7280;
            line-height: 1.4;
            margin: 0;
            word-break: keep-all;
        }

        .goods-footer-msg {
            text-align: center;
            font-size: 13px;
            color: #888888;
            padding-top: 16px;
            border-top: 1px dashed #ffccd5;
            margin: 0;
        }

        /* =======================================
           [도장판 영역 스타일]
        ======================================= */
        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #fff0f3;
        }

        .board-title {
            font-size: 20px;
            font-weight: bold;
            color: #c9184a;
            margin: 0;
        }

        .board-badge {
            font-size: 13px;
            font-weight: bold;
            color: #ff4d6d;
            background-color: #fff0f3;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .stamp-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
        }

        /* [1. 일반 미달성 빈 칸: 은은한 연분홍 테두리 & 배경] */
        .stamp-btn {
            position: relative;
            aspect-ratio: 1 / 1;
            background-color: #fffbfc;
            border: 1.5px solid #ffe3ea;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            transition: all 0.15s ease-in-out;
            overflow: hidden;
        }

        .stamp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 117, 143, 0.15);
            border-color: #ffccd5;
        }

        /* [2. 3의 배수 미달성 빈 칸: 은은한 연초코 테두리 & 배경] */
        .stamp-btn.special {
            background-color: #faf7f5;
            border: 1.5px solid #ede0d4;
        }

        .stamp-btn.special:hover {
            border-color: #d6c1af;
            box-shadow: 0 4px 8px rgba(111, 69, 24, 0.1);
        }

        .stamp-icon {
            width: 70%;
            height: 70%;
            object-fit: contain;
            pointer-events: none;
        }

        /* [3. 도장 획득 상태 (일반 - 분홍색)] */
        .stamp-btn.active {
            background-color: #ffe5ec;
            border: 2px solid #ff8fa3;
        }

        /* [4. 도장 획득 상태 (3의 배수 보상 칸 - 초코색)] */
        .stamp-btn.active.special {
            background-color: #ede0d4;
            border: 2px solid #b08968;
        }

        /* [숫자 라벨 스타일] */
        .stamp-number {
            position: absolute;
            bottom: 3px;
            right: 5px;
            font-size: 10px;
            color: #c9a9b0; /* 미달성 일반 칸 번호: 부드러운 핑크빛 회색 */
            font-weight: 600;
        }

        .stamp-btn.special .stamp-number {
            color: #bfaea2; /* 미달성 특별 칸 번호: 부드러운 밀크초코빛 회색 */
        }

        .stamp-btn.active .stamp-number {
            color: #c9184a; /* 활성화 일반 칸 번호: 딥 핑크 */
        }

        .stamp-btn.active.special .stamp-number {
            color: #6f4518; /* 활성화 특별 칸 번호: 딥 초콜릿 */
        }

        /* =======================================
           [상세 정보 모달 팝업]
        ======================================= */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-box {
            background: #ffffff;
            max-width: 380px;
            width: 100%;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            position: relative;
            text-align: left;
        }

        .modal-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.2s;
        }

        .modal-title-text {
            font-size: 18px;
            font-weight: bold;
            color: #1f2937;
        }

        .modal-close-icon {
            width: 28px;
            height: 28px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #6b7280;
            font-size: 14px;
            line-height: 1;
            padding: 0;
            transition: background 0.15s;
        }

        .modal-close-icon:hover {
            background: #e5e7eb;
            color: #111827;
        }

        .modal-item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 15px;
            color: #374151;
        }

        .modal-item {
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-all;
        }

        .modal-item-icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        .modal-item-link {
            color: #c9184a;
            text-decoration: none;
            font-weight: 500;
        }

        .modal-item-link:hover {
            text-decoration: underline;
        }

        /* =======================================
           [스마트폰/모바일 최적화]
        ======================================= */
        @media (max-width: 768px) {
            body {
                padding: 24px 12px;
                gap: 20px;
            }

            .container, .board-card, .goods-card {
                padding: 22px 16px;
                border-radius: 16px;
            }

            h1 {
                font-size: 22px;
            }

            .goods-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .stamp-grid {
                grid-template-columns: repeat(6, 1fr);
                gap: 6px;
            }

            .stamp-number {
                font-size: 8px;
                bottom: 2px;
                right: 3px;
            }
        }
    </style>
</head>
<body>

    <!-- 1. 상단 프로필/배너 메인 보드 -->
    <div class="container">
        <img src="my-image.png" alt="프로필 사진" class="profile-img">
        <h1>다정현 핫클립 저장소</h1>
        <p style="margin: 0; color: #666; font-size: 15px;">원하는 도장을 클릭하여 상세 클립 정보를 확인하세요.</p>
    </div>

    <!-- 2. 핫클립 굿즈 안내 박스 -->
    <div class="goods-card">
        <div class="goods-header">
            <h2 class="goods-title">🎁 핫클립 굿즈 안내</h2>
            <span class="goods-badge-pink">도장 3개마다 보상</span>
        </div>

        <div class="goods-description">
            쿠폰에 <b>도장 3개마다</b> 찍혀 있는 분에 한하여 지급하는 전용 굿즈입니다.<br>
            굿즈 배송은 제작 후 팬심을 통해 보내는 과정이 있어 <b>일정 시간이 소요</b>됩니다.<br>
            자세한 내용은 공지사항을 참고해주세요.
        </div>

        <div class="goods-grid" id="goods-grid-container"></div>

        <p class="goods-footer-msg">항상 클립 따주셔서 정말 감사합니다 💖 작게나마 보답이 되었으면 좋겠습니다!</p>
    </div>

    <!-- 3. 도장판 목록 영역 -->
    <div id="boards-container" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 24px;"></div>

    <!-- 4. 상세 정보 모달 창 -->
    <div class="modal-overlay" id="info-modal" onclick="closeModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header-row">
                <div class="modal-title-group">
                    <span class="title-dot" id="modal-dot"></span>
                    <span class="modal-title-text" id="modal-title">1번 도장</span>
                </div>
                <button class="modal-close-icon" onclick="closeModalDirect()">✕</button>
            </div>

            <div class="modal-item-list">
                <div class="modal-item">
                    <span class="modal-item-icon">🗓️</span>
                    <span id="modal-date">2026. 8. 31.</span>
                </div>
                <div class="modal-item">
                    <span class="modal-item-icon">💭</span>
                    <span id="modal-text">클립 정보가 없습니다.</span>
                </div>
                <div class="modal-item">
                    <span class="modal-item-icon">🎬</span>
                    <a href="#" id="modal-link" target="_blank" class="modal-item-link">링크 바로가기</a>
                </div>
            </div>
        </div>
    </div>

    <!-- [스크립트 로직] -->
    <script>
        const goodsList = [
            { id: 1, name: "다정현 손편지", desc: "보상사용 할까말까 고민되는군요", img: "gift1.png", isSpecial: false },
            { id: 2, name: "다정현 맥세이프 그립톡", desc: "이건 출시했으면 좋겠다", img: "gift2.png", isSpecial: false },
            { id: 3, name: "다정현 키링", desc: "키링 잘 쓰고 있지롱", img: "gift3.png", isSpecial: false },
            { id: 4, name: "다정현 아크릴 스탠드", desc: "어흐 내 아내", img: "gift4.png", isSpecial: false },
            { id: 5, name: "다정현 캔뱃지", desc: "개쳐귀여움 ㅋㅋ", img: "gift5.png", isSpecial: false },
            { id: 6, name: "다정현 머그컵", desc: "머그컵 잘 쓰고 있습니다", img: "gift6.png", isSpecial: false },
            { id: 7, name: "다정현 향수", desc: "매일 쓰는 중", img: "gift7.png", isSpecial: false },
            { id: 8, name: "다정현 장패드", desc: "이것도 출시했으면 좋겠다2222", img: "gift8.png", isSpecial: true }
        ];

        function renderGoods() {
            const container = document.getElementById("goods-grid-container");
            container.innerHTML = "";

            goodsList.forEach(item => {
                const itemDiv = document.createElement("div");
                itemDiv.className = "goods-item";

                const badgeClass = item.isSpecial ? "goods-badge-no special" : "goods-badge-no";
                const badgeText = item.isSpecial ? `No.${item.id} ◆ 도장 9개` : `No.${item.id}`;

                itemDiv.innerHTML = `
                    <div class="goods-img-wrapper">
                        <img src="${item.img}" alt="${item.name}" class="goods-img">
                    </div>
                    <span class="${badgeClass}">${badgeText}</span>
                    <h3 class="goods-name">${item.name}</h3>
                    <p class="goods-info">${item.desc}</p>
                `;

                container.appendChild(itemDiv);
            });
        }

        const totalBoards = 20;
        const stampsPerBoard = 30;

        const boardNames = {
            1: "다정현",
            2: "조선우",
            3: "우초이",
            4: "카티야",
            5: "이바",
            6: "일레븐"
        };

        const boardActiveCounts = {
            1: 6,
            2: 5,
            3: 3,
            4: 2,
            5: 1,
            6: 0
        };

        const stampData = {
            "1-1": { date: "2026. 8. 31.", text: "26.08 [반캠] 업보청산", url: "https://chzzk.naver.com/clips/Jk7KNdlKcs" },
            "1-2": { date: "2026. 8. 31.", text: "26.08 [저챗] 마음과 뇌의 싸움", url: "https://chzzk.naver.com/clips/bp72a4teVq" },
            "1-3": { date: "2026. 8. 31.", text: "26.08 [마크] 폭탄 추격전", url: "https://chzzk.naver.com/clips/MiojMHRjVm" },
            "1-4": { date: "2026. 8. 31.", text: "26.08 [반캠] 업보청산", url: "https://chzzk.naver.com/clips/Jk7KNdlKcs" },
            "1-5": { date: "2026. 8. 31.", text: "26.08 [저챗] 마음과 뇌의 싸움", url: "https://chzzk.naver.com/clips/bp72a4teVq" },
            "1-6": { date: "2026. 8. 31.", text: "26.08 [마크] 폭탄 추격전", url: "https://chzzk.naver.com/clips/MiojMHRjVm" },
            "2-1": { date: "2026. 8. 31.", text: "26.08 [T1] 버른살의 애교", url: "https://chzzk.naver.com/clips/iam0ruNKlk" },
            "2-2": { date: "2026. 8. 31.", text: "26.08 [T1] 버른살의 애교", url: "https://chzzk.naver.com/clips/iam0ruNKlk" },
            "2-3": { date: "2026. 8. 31.", text: "26.08 [T1] 버른살의 애교", url: "https://chzzk.naver.com/clips/iam0ruNKlk" }
        };

        function initBoards() {
            const container = document.getElementById("boards-container");
            container.innerHTML = "";

            for (let b = 1; b <= totalBoards; b++) {
                const card = document.createElement("div");
                card.className = "board-card";

                const activeCount = boardActiveCounts[b] || 0;
                const currentBoardTitle = boardNames[b] || `도장판 #${b}`;

                const header = document.createElement("div");
                header.className = "board-header";
                header.innerHTML = `
                    <h2 class="board-title">${currentBoardTitle}</h2>
                    <span class="board-badge">도장 ${activeCount} / ${stampsPerBoard}개</span>
                `;
                card.appendChild(header);

                const grid = document.createElement("div");
                grid.className = "stamp-grid";

                for (let s = 1; s <= stampsPerBoard; s++) {
                    const btn = document.createElement("button");
                    btn.className = "stamp-btn";

                    if (s % 3 === 0) {
                        btn.classList.add("special");
                    }

                    if (s <= activeCount) {
                        btn.classList.add("active");
                        btn.innerHTML = `<img src="Jerry.png" alt="도장" class="stamp-icon"><span class="stamp-number">${s}</span>`;
                    } else {
                        btn.innerHTML = `<span class="stamp-number">${s}</span>`;
                    }

                    btn.onclick = () => openModal(b, s, activeCount);
                    grid.appendChild(btn);
                }

                card.appendChild(grid);
                container.appendChild(card);
            }
        }

        function openModal(boardIndex, stampIndex, activeCount) {
            const key = `${boardIndex}-${stampIndex}`;
            const data = stampData[key] || {
                date: "날짜 정보 없음",
                text: "등록된 클립 정보가 없습니다.",
                url: ""
            };

            document.getElementById("modal-title").textContent = `${stampIndex}번 도장`;
            document.getElementById("modal-date").textContent = data.date;
            document.getElementById("modal-text").textContent = data.text;

            const dotElem = document.getElementById("modal-dot");
            if (stampIndex <= activeCount) {
                dotElem.style.backgroundColor = (stampIndex % 3 === 0) ? "#b08968" : "#ff758f";
            } else {
                dotElem.style.backgroundColor = (stampIndex % 3 === 0) ? "#ede0d4" : "#ffe3ea";
            }

            const linkElem = document.getElementById("modal-link");
            if (data.url) {
                linkElem.href = data.url;
                linkElem.textContent = data.url.replace(/^https?:\/\//, "");
                linkElem.style.display = "inline";
            } else {
                linkElem.textContent = "링크 없음";
                linkElem.removeAttribute("href");
            }

            document.getElementById("info-modal").style.display = "flex";
        }

        function closeModal(event) {
            if (event.target.id === "info-modal") {
                document.getElementById("info-modal").style.display = "none";
            }
        }

        function closeModalDirect() {
            document.getElementById("info-modal").style.display = "none";
        }

        window.addEventListener("DOMContentLoaded", () => {
            renderGoods();
            initBoards();
        });
    </script>
</body>
</html>
