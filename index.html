<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도장판 모음</title>
    
    <style>
        /* 전체 페이지 배경 및 레이아웃 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fff0f3;
            color: #4a4a4a;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* 개별 도장판 카드 */
        .board-card {
            background: #ffffff;
            max-width: 900px;
            width: 100%;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #ffccd5;
            box-shadow: 0 8px 20px rgba(255, 117, 143, 0.12);
            box-sizing: border-box;
        }

        /* 도장판 상단 헤더 */
        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #fff0f3;
        }

        .board-title {
            font-size: 20px;
            font-weight: bold;
            color: #c9184a;
            margin: 0;
        }

        .board-badge {
            font-size: 13px;
            font-weight: bold;
            color: #ff4d6d;
            background-color: #fff0f3;
            padding: 6px 12px;
            border-radius: 20px;
        }

        /* 30칸 그리드 (가로 10칸) */
        .stamp-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
        }

        /* 모바일 대응 (가로 5칸) */
        @media (max-width: 768px) {
            .stamp-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        /* 개별 도장 버튼 */
        .stamp-btn {
            position: relative;
            aspect-ratio: 1 / 1;
            background-color: #f0f7ff;
            border: 2px solid #b9dcff;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.15s ease-in-out;
            font-size: 18px;
            color: #2b7fff;
            padding: 0;
        }

        .stamp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* 3의 배수 특별 보상 칸 */
        .stamp-btn.special {
            background-color: #fff8e6;
            border: 2px solid #ffd166;
            color: #f77f00;
        }

        /* 도장 우측 하단 번호 */
        .stamp-number {
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-size: 10px;
            color: #888888;
        }

        /* 팝업 모달 배경 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 팝업 창 본체 */
        .modal-box {
            background: #ffffff;
            max-width: 420px;
            width: 100%;
            border-radius: 18px;
            padding: 28px;
            border: 1px solid #ffccd5;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            box-sizing: border-box;
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            color: #c9184a;
            margin-bottom: 6px;
        }

        .modal-date {
            font-size: 13px;
            color: #888888;
            margin-bottom: 16px;
        }

        .modal-info {
            font-size: 15px;
            color: #444444;
            line-height: 1.6;
            margin-bottom: 24px;
            background-color: #fff0f3;
            padding: 14px;
            border-radius: 10px;
            text-align: left;
        }

        .modal-link-btn {
            display: inline-block;
            background-color: #ff758f;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            width: calc(100% - 48px);
            margin-bottom: 10px;
            transition: background-color 0.2s;
        }

        .modal-link-btn:hover {
            background-color: #ff4d6d;
        }

        .modal-close-btn {
            background: none;
            border: none;
            color: #888888;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- 20개의 도장판이 생성될 영역 -->
    <div id="boards-container" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 24px;"></div>

    <!-- 클릭 시 노출되는 모달 팝업 -->
    <div class="modal-overlay" id="info-modal" onclick="closeModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header" id="modal-title">[ 1번 도장 ]</div>
            <div class="modal-date" id="modal-date">2026-08-01</div>
            <div class="modal-info" id="modal-desc">간단한 정보가 표시됩니다.</div>
            <a href="#" id="modal-link" target="_blank" class="modal-link-btn">링크 바로가기</a>
            <br>
            <button class="modal-close-btn" onclick="closeModalDirect()">닫기</button>
        </div>
    </div>

    <script>
        const totalBoards = 20;   // 생성할 도장판 개수
        const stampsPerBoard = 30; // 판당 도장 개수

        // 20개의 도장판 자동 렌더링
        function initBoards() {
            const container = document.getElementById("boards-container");
            container.innerHTML = "";

            for (let b = 1; b <= totalBoards; b++) {
                // 1. 도장판 카드 생성
                const card = document.createElement("div");
                card.className = "board-card";

                // 2. 상단 헤더 (제목 및 배지)
                const header = document.createElement("div");
                header.className = "board-header";
                header.innerHTML = `
                    <h2 class="board-title">도장판 #${b}</h2>
                    <span class="board-badge">총 30칸</span>
                `;
                card.appendChild(header);

                // 3. 도장 그리드 생성
                const grid = document.createElement("div");
                grid.className = "stamp-grid";

                for (let s = 1; s <= stampsPerBoard; s++) {
                    const btn = document.createElement("button");
                    btn.className = "stamp-btn";
                    
                    // 3의 배수 보상 칸 강조
                    if (s % 3 === 0) {
                        btn.classList.add("special");
                    }

                    btn.innerHTML = `★<span class="stamp-number">${s}</span>`;
                    btn.onclick = () => openModal(b, s);

                    grid.appendChild(btn);
                }

                card.appendChild(grid);
                container.appendChild(card);
            }
        }

        // 모달 열기 함수
        function openModal(boardIndex, stampIndex) {
            document.getElementById("modal-title").textContent = `[ 도장판 #${boardIndex} - ${stampIndex}번 도장 ]`;
            document.getElementById("modal-date").textContent = `날짜: 2026-08-${stampIndex < 10 ? '0' + stampIndex : stampIndex}`;
            document.getElementById("modal-desc").textContent = `${boardIndex}번째 판의 ${stampIndex}번 도장 상세 안내 정보입니다.`;
            document.getElementById("modal-link").href = "https://youtube.com";

            document.getElementById("info-modal").style.display = "flex";
        }

        // 모달 닫기 함수
        function closeModal(event) {
            if (event.target.id === "info-modal") {
                document.getElementById("info-modal").style.display = "none";
            }
        }

        function closeModalDirect() {
            document.getElementById("info-modal").style.display = "none";
        }

        // 페이지 로드 시 도장판 20개 생성 실행
        window.addEventListener("DOMContentLoaded", initBoards);
    </script>
</body>
</html>
