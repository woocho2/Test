<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다정현네 체리창고</title>
    
    <style>
        /* [전체 배경 및 레이아웃] 카드를 세로로 정렬하고 가운데 맞춤 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fff0f3;
            color: #4a4a4a;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column; /* 세로 방향으로 쌓이도록 지정 */
            align-items: center;    /* 화면 가운데 정렬 */
            gap: 24px;              /* 카드 사이의 여백 */
        }

        /* [메인 카드 스타일] */
        .container {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #ffccd5;
            box-shadow: 0 8px 20px rgba(255, 117, 143, 0.15);
            text-align: center;
            box-sizing: border-box; /* 패딩이 전체 너비에 포함되도록 설정 */
        }

        /* [이미지 스타일] 박스 크기에 맞춰 비율 유지 */
        .profile-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 16px;
            border-radius: 12px;
            border: 3px solid #ff758f;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #c9184a;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #595959;
            margin-bottom: 24px;
        }

        /* [상호작용 버튼 스타일] */
        .action-button {
            background-color: #ff758f;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .action-button:hover {
            background-color: #ff4d6d;
        }

        .action-button:active {
            transform: scale(0.98);
        }

        #result-text {
            margin-top: 20px;
            font-size: 16px;
            font-weight: 600;
            color: #a4133c;
        }

        /* [하단 추가 카드 스타일] */
        .sub-container {
            background: #ffffff;
            max-width: 600px;       /* 메인 카드와 동일한 너비 유지 */
            width: 100%;
            padding: 24px 30px;
            border-radius: 16px;
            border: 1px solid #ffccd5;
            box-shadow: 0 4px 15px rgba(255, 117, 143, 0.1);
            box-sizing: border-box;
        }

        .sub-title {
            font-size: 18px;
            color: #c9184a;
            margin: 0 0 16px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #fff0f3;
        }

        /* 링크 버튼 컨테이너 */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 링크 버튼 디자인 */
        .link-button {
            display: block;
            padding: 12px;
            text-align: center;
            background-color: #fff0f3;
            color: #c9184a;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .link-button:hover {
            background-color: #ffccd5;
        }
    </style>
</head>
<body>

    <!-- 1. 상단 메인 프로필 카드 -->
    <div class="container">
        <img src="my-image.png" alt="프로필 사진" class="profile-img">
        <h1>다정현 핫클립</h1>
        <p>이번주 핫클립이에용.</p>
        
        <button class="action-button" onclick="handleButtonClick()">클릭해보기</button>
        <div id="result-text"></div>
    </div>

    <!-- 2. 하단 활동 및 링크 카드 -->
    <div class="sub-container">
        <h2 class="sub-title">활동 및 링크</h2>
        <div class="link-list">
            <a href="https://chzzk.naver.com/270b1c629013679b7341b0e764c0fc0a" target="_blank" class="link-button">치지직 프로필 바로가기</a>
            <a href="https://www.youtube.com/@dajunghyun" target="_blank" class="link-button">유튜브 채널 바로가기</a>
        </div>
    </div>

    <!-- 3. 하단 공지사항 카드 -->
    <div class="sub-container">
        <h2 class="sub-title">공지사항</h2>
        <p style="font-size: 14px; color: #666; margin: 0; line-height: 1.6;">
            웹사이트를 지속적으로 업데이트하고 있습니다. 방문해 주셔서 감사합니다.
        </p>
    </div>

    <script>
        let clickCount = 0;

        function handleButtonClick() {
            clickCount += 1;
            const outputElement = document.getElementById("result-text");
            outputElement.textContent = `버튼을 ${clickCount}번 클릭했습니다.`;
        }
    </script>
</body>
</html>
