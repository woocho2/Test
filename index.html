<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다정현 핫클립 저장소</title>
    
    <style>
        /* [전체 기본 레이아웃] */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fff0f3;
            color: #4a4a4a;
            margin: 0;
            padding: 20px 20px 100px;
            box-sizing: border-box;
            overflow-y: scroll;
        }

        /* [최상단 관리자 로그인 바] */
        .top-auth-container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto 12px;
            display: flex;
            justify-content: flex-end;
            box-sizing: border-box;
        }

        .auth-btn {
            padding: 7px 15px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #ffccd5;
            background-color: #ffffff;
            color: #c9184a;
            box-shadow: 0 2px 6px rgba(255, 117, 143, 0.1);
            transition: all 0.2s;
        }

        .auth-btn.logged-in {
            background-color: #c9184a;
            color: #ffffff;
            border-color: #c9184a;
        }

        .auth-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* [공통 카드 컨테이너] */
        .container, .board-card, .goods-card {
            background: #ffffff;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto 24px;
            padding: 35px 40px;
            border-radius: 20px;
            border: 1px solid #ffccd5;
            box-shadow: 0 8px 20px rgba(255, 117, 143, 0.12);
            box-sizing: border-box;
            position: relative;
        }

        .container {
            text-align: center;
        }

        /* [상단 배너 이미지] */
        .profile-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 20px;
            border-radius: 16px;
            border: 4px solid #ff758f;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #c9184a;
        }

        /* =======================================
           [굿즈 안내 박스 스타일]
        ======================================= */
        .goods-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .goods-title {
            font-size: 20px;
            font-weight: bold;
            color: #c9184a;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .goods-badge-pink {
            font-size: 12px;
            font-weight: bold;
            color: #c9184a;
            background-color: #fff0f3;
            border: 1px solid #ffccd5;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .goods-description {
            font-size: 14px;
            color: #4b5563;
            line-height: 1.7;
            margin: 0 0 20px 0;
        }

        .goods-description b {
            color: #c9184a;
        }

        .goods-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .goods-item {
            background: #ffffff;
            border: 1px solid #ffe5ec;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            text-align: left;
            transition: transform 0.15s ease-in-out, box-shadow 0.15s;
            position: relative;
        }

        .goods-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(255, 117, 143, 0.15);
            border-color: #ffccd5;
        }

        .is-admin .goods-item {
            cursor: pointer;
        }
        .is-admin .goods-item:hover::after {
            content: "✏️ 클릭하여 수정";
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(201, 24, 74, 0.9);
            color: #ffffff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .goods-img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #fffafb;
            border: 1px solid #fff0f3;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .goods-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .goods-badge-no {
            align-self: flex-start;
            font-size: 11px;
            font-weight: bold;
            color: #c9184a;
            background-color: #ffe5ec;
            padding: 2px 8px;
            border-radius: 12px;
            margin-bottom: 6px;
        }

        .goods-badge-no.special {
            color: #6f4518;
            background-color: #ede0d4;
            border: 1px solid #b08968;
        }

        .goods-name {
            font-size: 14px;
            font-weight: bold;
            color: #111827;
            margin: 0 0 4px 0;
            line-height: 1.3;
        }

        .goods-info {
            font-size: 11px;
            color: #6b7280;
            line-height: 1.4;
            margin: 0;
            word-break: keep-all;
        }

        .goods-footer-msg {
            text-align: center;
            font-size: 13px;
            color: #888888;
            padding-top: 16px;
            border-top: 1px dashed #ffccd5;
            margin: 0;
        }

        /* =======================================
           [검색 및 정렬 바 - 상단 Sticky]
        ======================================= */
        .search-sort-bar-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: #fff0f3;
            width: 100%;
            padding: 16px 0;
            margin-bottom: 8px;
        }

        .search-sort-bar {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            box-sizing: border-box;
        }

        .search-box-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            font-size: 16px;
            color: #ff758f;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border-radius: 12px;
            border: 1.5px solid #ffccd5;
            background-color: #ffffff;
            font-size: 14px;
            color: #4a4a4a;
            outline: none;
            box-shadow: 0 4px 10px rgba(255, 117, 143, 0.08);
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: #ff758f;
            box-shadow: 0 4px 12px rgba(255, 117, 143, 0.2);
        }

        .sort-btn-group {
            display: flex;
            gap: 6px;
            background: #ffffff;
            padding: 4px;
            border-radius: 12px;
            border: 1.5px solid #ffccd5;
            box-shadow: 0 4px 10px rgba(255, 117, 143, 0.08);
            flex-shrink: 0;
        }

        .sort-btn {
            border: none;
            background: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #888888;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }

        .sort-btn:hover {
            color: #c9184a;
            background-color: #fff0f3;
        }

        .sort-btn.active {
            background-color: #ff758f;
            color: #ffffff;
        }

        /* 관리자 도장판 추가 툴바 */
        .admin-controls-bar {
            max-width: 1100px;
            width: 100%;
            margin: -6px auto 18px;
            display: none;
            justify-content: flex-end;
        }

        .admin-controls-bar.active {
            display: flex;
        }

        .btn-add-board {
            background-color: #c9184a;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 13.5px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(201, 24, 74, 0.2);
            transition: all 0.2s;
        }

        .btn-add-board:hover {
            background-color: #a01036;
        }

        #boards-container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            min-height: 70vh;
        }

        .no-result-msg {
            background: #ffffff;
            width: 100%;
            padding: 40px 20px;
            border-radius: 20px;
            border: 1px dashed #ffccd5;
            text-align: center;
            color: #888888;
            font-size: 15px;
            box-sizing: border-box;
            display: none;
        }

        /* =======================================
           [도장판 영역 스타일]
        ======================================= */
        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #fff0f3;
        }

        .board-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .board-title {
            font-size: 20px;
            font-weight: bold;
            color: #c9184a;
            margin: 0;
        }

        .board-admin-btns {
            display: none;
            gap: 6px;
        }

        .is-admin .board-admin-btns {
            display: flex;
        }

        .btn-board-edit, .btn-board-delete {
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #ffccd5;
            background: #fff0f3;
            color: #c9184a;
            transition: all 0.15s;
        }

        .btn-board-edit:hover {
            background-color: #ffd6df;
        }

        .btn-board-delete {
            color: #e53e3e;
            border-color: #fed7d7;
            background: #fff5f5;
        }

        .btn-board-delete:hover {
            background-color: #fed7d7;
        }

        .board-badge {
            font-size: 13px;
            font-weight: bold;
            color: #ff4d6d;
            background-color: #fff0f3;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .stamp-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
        }

        .stamp-btn {
            position: relative;
            aspect-ratio: 1 / 1;
            background-color: #fffbfc;
            border: 1.5px solid #ffe3ea;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            transition: all 0.15s ease-in-out;
            overflow: hidden;
        }

        .stamp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 117, 143, 0.15);
            border-color: #ffccd5;
        }

        .stamp-btn.special {
            background-color: #faf7f5;
            border: 1.5px solid #ede0d4;
        }

        .stamp-btn.special:hover {
            border-color: #d6c1af;
            box-shadow: 0 4px 8px rgba(111, 69, 24, 0.1);
        }

        .stamp-icon {
            width: 70%;
            height: 70%;
            object-fit: contain;
            pointer-events: none;
        }

        .stamp-btn.active {
            background-color: #ffe5ec;
            border: 2px solid #ff8fa3;
        }

        .stamp-btn.active.special {
            background-color: #ede0d4;
            border: 2px solid #b08968;
        }

        .stamp-number {
            position: absolute;
            bottom: 3px;
            right: 5px;
            font-size: 10px;
            color: #c9a9b0;
            font-weight: 600;
        }

        .stamp-btn.special .stamp-number {
            color: #bfaea2;
        }

        .stamp-btn.active .stamp-number {
            color: #c9184a;
        }

        .stamp-btn.active.special .stamp-number {
            color: #6f4518;
        }

        /* =======================================
           [공통 모달 팝업]
        ======================================= */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-box {
            background: #ffffff;
            max-width: 420px;
            width: 100%;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            position: relative;
            text-align: left;
        }

        .modal-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.2s;
        }

        .modal-title-text {
            font-size: 18px;
            font-weight: bold;
            color: #1f2937;
        }

        .modal-close-icon {
            width: 28px;
            height: 28px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #6b7280;
            font-size: 14px;
            line-height: 1;
            padding: 0;
            transition: background 0.15s;
        }

        .modal-close-icon:hover {
            background: #e5e7eb;
            color: #111827;
        }

        .modal-view-mode {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 15px;
            color: #374151;
        }

        .modal-item {
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-all;
        }

        .modal-item-icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        .modal-item-link {
            color: #c9184a;
            text-decoration: none;
            font-weight: 500;
        }

        .modal-item-link:hover {
            text-decoration: underline;
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .modal-form-group label {
            font-size: 12px;
            font-weight: bold;
            color: #6b7280;
        }

        .modal-input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ffccd5;
            border-radius: 8px;
            font-size: 13.5px;
            outline: none;
            box-sizing: border-box;
        }

        .modal-input:focus {
            border-color: #ff758f;
        }

        .modal-btn-save {
            background-color: #c9184a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
            transition: opacity 0.2s;
        }

        .modal-btn-save:hover {
            opacity: 0.9;
        }

        /* =======================================
           [스마트폰/모바일 최적화]
        ======================================= */
        @media (max-width: 768px) {
            body {
                padding: 16px 12px 60px;
            }

            .top-auth-container {
                margin-bottom: 10px;
            }

            .auth-btn {
                padding: 6px 12px;
                font-size: 12px;
            }

            .container, .board-card, .goods-card {
                padding: 22px 16px;
                border-radius: 16px;
                margin-bottom: 16px;
            }

            h1 {
                font-size: 22px;
            }

            .search-sort-bar-wrapper {
                padding: 10px 0;
                margin-bottom: 12px;
            }

            .search-sort-bar {
                flex-direction: column;
                gap: 10px;
            }

            .sort-btn-group {
                width: 100%;
                justify-content: space-between;
                box-sizing: border-box;
            }

            .sort-btn {
                flex: 1;
                padding: 8px 6px;
                text-align: center;
            }

            .goods-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .stamp-grid {
                grid-template-columns: repeat(6, 1fr);
                gap: 6px;
            }

            .stamp-number {
                font-size: 8px;
                bottom: 2px;
                right: 3px;
            }
        }
    </style>
</head>
<body>

    <div class="top-auth-container">
        <button class="auth-btn" id="authBtn">관리자 로그인</button>
    </div>

    <div class="container">
        <img src="my-image.png" alt="프로필 사진" class="profile-img">
        <h1>다정현 핫클립 저장소</h1>
        <p style="margin: 0; color: #666; font-size: 15px;">원하는 도장을 클릭하여 상세 클립 정보를 확인하세요.</p>
    </div>

    <div class="goods-card" id="goodsCardContainer">
        <div class="goods-header">
            <h2 class="goods-title">🎁 핫클립 굿즈 안내</h2>
            <span class="goods-badge-pink">도장 3개마다 보상</span>
        </div>

        <div class="goods-description">
            쿠폰에 <b>도장 3개마다</b> 찍혀 있는 분에 한하여 지급하는 전용 굿즈입니다.<br>
            굿즈 배송은 제작 후 팬심을 통해 보내는 과정이 있어 <b>일정 시간이 소요</b>됩니다.<br>
            자세한 내용은 공지사항을 참고해주세요.
        </div>

        <div class="goods-grid" id="goods-grid-container"></div>

        <p class="goods-footer-msg">항상 클립 따주셔서 정말 감사합니다 💖 작게나마 보답이 되었으면 좋겠습니다!</p>
    </div>

    <div class="search-sort-bar-wrapper">
        <div class="search-sort-bar">
            <div class="search-box-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="nickname-search" class="search-input" placeholder="닉네임 검색">
            </div>
            <div class="sort-btn-group">
                <button class="sort-btn active" id="sort-name">가나다순</button>
                <button class="sort-btn" id="sort-stamps">도장순</button>
                <button class="sort-btn" id="sort-latest">최신순</button>
            </div>
        </div>
    </div>

    <div class="admin-controls-bar" id="adminControlsBar">
        <button class="btn-add-board" id="btnAddBoard">+ 도장판 새로 만들기</button>
    </div>

    <div id="boards-container">
        <div class="no-result-msg" id="no-result-msg"></div>
    </div>

    <div class="modal-overlay" id="info-modal">
        <div class="modal-box">
            <div class="modal-header-row">
                <div class="modal-title-group">
                    <span class="title-dot" id="modal-dot"></span>
                    <span class="modal-title-text" id="modal-title">1번 도장</span>
                </div>
                <button class="modal-close-icon" id="modalCloseIcon">✕</button>
            </div>

            <div class="modal-view-mode" id="modalViewMode">
                <div class="modal-item">
                    <span class="modal-item-icon">🗓️</span>
                    <span id="modal-date">2026. 8. 31.</span>
                </div>
                <div class="modal-item">
                    <span class="modal-item-icon">💭</span>
                    <span id="modal-text">클립 정보가 없습니다.</span>
                </div>
                <div class="modal-item">
                    <span class="modal-item-icon">🎬</span>
                    <a href="#" id="modal-link" target="_blank" class="modal-item-link">링크 바로가기</a>
                </div>
            </div>

            <div class="modal-form" id="modalEditMode" style="display: none;">
                <div class="modal-form-group">
                    <label>날짜 (예: 2026. 8. 31.)</label>
                    <input type="text" class="modal-input" id="editStampDate" placeholder="2026. 8. 31.">
                </div>
                <div class="modal-form-group">
                    <label>클립 정보/내용</label>
                    <input type="text" class="modal-input" id="editStampText" placeholder="26.08 [반캠] 업보청산">
                </div>
                <div class="modal-form-group">
                    <label>영상 링크 URL</label>
                    <input type="text" class="modal-input" id="editStampUrl" placeholder="https://chzzk.naver.com/clips/...">
                </div>
                <button class="modal-btn-save" id="btnSaveStamp">도장 내용 저장</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="goods-edit-modal">
        <div class="modal-box">
            <div class="modal-header-row">
                <div class="modal-title-group">
                    <span class="title-dot" style="background-color: #c9184a;"></span>
                    <span class="modal-title-text" id="goodsModalTitle">굿즈 정보 수정</span>
                </div>
                <button class="modal-close-icon" id="goodsModalCloseIcon">✕</button>
            </div>

            <div class="modal-form">
                <div class="modal-form-group">
                    <label>이미지 파일명 또는 URL (예: gift1.png 또는 외부 링크)</label>
                    <input type="text" class="modal-input" id="editGoodsImg" placeholder="gift1.png">
                </div>
                <div class="modal-form-group">
                    <label>굿즈 이름</label>
                    <input type="text" class="modal-input" id="editGoodsName" placeholder="다정현 손편지">
                </div>
                <div class="modal-form-group">
                    <label>상세 설명 문구</label>
                    <input type="text" class="modal-input" id="editGoodsDesc" placeholder="보상사용 할까말까 고민되는군요">
                </div>
                <button class="modal-btn-save" id="btnSaveGoods">굿즈 정보 저장</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBDjgnb24_rrUhuafg2jvE7UoSSNR6Z-7o",
            authDomain: "schedule-a56bb.firebaseapp.com",
            projectId: "schedule-a56bb",
            storageBucket: "schedule-a56bb.firebasestorage.app",
            messagingSenderId: "791715427873",
            appId: "1:791715427873:web:b40e0cd6f2a6c892901560"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const STAMPS_PER_BOARD = 30;

        const defaultGoodsList = [
            { id: 1, name: "다정현 손편지", desc: "보상사용 할까말까 고민되는군요", img: "gift1.png", isSpecial: false },
            { id: 2, name: "다정현 맥세이프 그립톡", desc: "이건 출시했으면 좋겠다", img: "gift2.png", isSpecial: false },
            { id: 3, name: "다정현 키링", desc: "키링 잘 쓰고 있지롱", img: "gift3.png", isSpecial: false },
            { id: 4, name: "다정현 아크릴 스탠드", desc: "어흐 내 아내", img: "gift4.png", isSpecial: false },
            { id: 5, name: "다정현 캔뱃지", desc: "개쳐귀여움 ㅋㅋ", img: "gift5.png", isSpecial: false },
            { id: 6, name: "다정현 머그컵", desc: "머그컵 잘 쓰고 있습니다", img: "gift6.png", isSpecial: false },
            { id: 7, name: "다정현 향수", desc: "매일 쓰는 중", img: "gift7.png", isSpecial: false },
            { id: 8, name: "다정현 장패드", desc: "이것도 출시했으면 좋겠다2222", img: "gift8.png", isSpecial: true }
        ];

        const defaultBoards = {
            1: { name: "다정현", count: 6 },
            2: { name: "조선우", count: 5 },
            3: { name: "우초이", count: 3 }
        };

        const state = {
            currentUser: null,
            goods: defaultGoodsList,
            boards: {},
            stamps: {},
            currentSortMode: 'name',
            searchQuery: '',
            activeEditingStamp: null,
            activeEditingGoods: null
        };

        const authBtn = document.getElementById('authBtn');
        const adminControlsBar = document.getElementById('adminControlsBar');
        const btnAddBoard = document.getElementById('btnAddBoard');
        const nicknameSearch = document.getElementById('nickname-search');
        const sortButtons = {
            name: document.getElementById('sort-name'),
            stamps: document.getElementById('sort-stamps'),
            latest: document.getElementById('sort-latest')
        };
        const goodsCardContainer = document.getElementById('goodsCardContainer');

        const infoModal = document.getElementById('info-modal');
        const modalCloseIcon = document.getElementById('modalCloseIcon');
        const modalTitle = document.getElementById('modal-title');
        const modalDot = document.getElementById('modal-dot');
        const modalViewMode = document.getElementById('modalViewMode');
        const modalDate = document.getElementById('modal-date');
        const modalText = document.getElementById('modal-text');
        const modalLink = document.getElementById('modal-link');
        const modalEditMode = document.getElementById('modalEditMode');
        const editStampDate = document.getElementById('editStampDate');
        const editStampText = document.getElementById('editStampText');
        const editStampUrl = document.getElementById('editStampUrl');
        const btnSaveStamp = document.getElementById('btnSaveStamp');

        const goodsEditModal = document.getElementById('goods-edit-modal');
        const goodsModalCloseIcon = document.getElementById('goodsModalCloseIcon');
        const goodsModalTitle = document.getElementById('goodsModalTitle');
        const editGoodsImg = document.getElementById('editGoodsImg');
        const editGoodsName = document.getElementById('editGoodsName');
        const editGoodsDesc = document.getElementById('editGoodsDesc');
        const btnSaveGoods = document.getElementById('btnSaveGoods');

        function parseStampDate(dateStr) {
            if (!dateStr || dateStr.includes("없음")) return 0;
            const parts = dateStr.split('.').map(p => parseInt(p.trim(), 10));
            if (parts.length >= 3 && !isNaN(parts[0]) && !isNaN(parts[1]) && !isNaN(parts[2])) {
                return new Date(parts[0], parts[1] - 1, parts[2]).getTime();
            }
            return 0;
        }

        function getLatestStampTimestamp(boardId, activeCount) {
            if (activeCount <= 0) return 0;
            for (let s = activeCount; s >= 1; s--) {
                const key = `${boardId}-${s}`;
                if (state.stamps[key]?.date) {
                    const time = parseStampDate(state.stamps[key].date);
                    if (time > 0) return time;
                }
            }
            return 0;
        }

        function renderGoods() {
            const container = document.getElementById("goods-grid-container");
            container.innerHTML = "";
            goodsCardContainer.classList.toggle('is-admin', !!state.currentUser);

            state.goods.forEach(item => {
                const itemDiv = document.createElement("div");
                itemDiv.className = "goods-item";

                const badgeClass = item.isSpecial ? "goods-badge-no special" : "goods-badge-no";
                const badgeText = item.isSpecial ? `No.${item.id} ◆ 도장 9개` : `No.${item.id}`;

                itemDiv.innerHTML = `
                    <div class="goods-img-wrapper">
                        <img src="${item.img}" alt="${item.name}" class="goods-img">
                    </div>
                    <span class="${badgeClass}">${badgeText}</span>
                    <h3 class="goods-name">${item.name}</h3>
                    <p class="goods-info">${item.desc}</p>
                `;

                itemDiv.onclick = () => {
                    if (state.currentUser) openGoodsEditModal(item);
                };

                container.appendChild(itemDiv);
            });
        }

        function openGoodsEditModal(item) {
            state.activeEditingGoods = item;
            goodsModalTitle.textContent = `No.${item.id} 굿즈 정보 수정`;
            editGoodsImg.value = item.img || "";
            editGoodsName.value = item.name || "";
            editGoodsDesc.value = item.desc || "";
            goodsEditModal.style.display = "flex";
        }

        function closeGoodsEditModal() {
            goodsEditModal.style.display = "none";
            state.activeEditingGoods = null;
        }

        async function saveGoodsData() {
            if (!state.currentUser || !state.activeEditingGoods) return;

            const updatedItem = {
                id: state.activeEditingGoods.id,
                name: editGoodsName.value.trim() || state.activeEditingGoods.name,
                desc: editGoodsDesc.value.trim() || state.activeEditingGoods.desc,
                img: editGoodsImg.value.trim() || state.activeEditingGoods.img,
                isSpecial: !!state.activeEditingGoods.isSpecial
            };

            try {
                await setDoc(doc(db, "hotclips_goods", String(updatedItem.id)), updatedItem);
                closeGoodsEditModal();
            } catch (err) {
                console.error("굿즈 정보 저장 실패:", err);
                alert("굿즈 저장 중 오류가 발생했습니다: " + err.message);
            }
        }

        function renderBoards() {
            const container = document.getElementById("boards-container");
            const noResultElem = document.getElementById("no-result-msg");
            
            Array.from(container.children).forEach(child => {
                if (child.id !== 'no-result-msg') child.remove();
            });

            const list = Object.entries(state.boards).map(([id, data]) => ({
                id: id,
                name: data.name || `도장판 #${id}`,
                count: Number(data.count) || 0,
                latestTime: getLatestStampTimestamp(id, data.count)
            }));

            if (state.currentSortMode === 'name') {
                list.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
            } else if (state.currentSortMode === 'stamps') {
                list.sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'ko'));
            } else if (state.currentSortMode === 'latest') {
                list.sort((a, b) => b.latestTime - a.latestTime || b.count - a.count || a.name.localeCompare(b.name, 'ko'));
            }

            let visibleCount = 0;
            const fragment = document.createDocumentFragment();

            list.forEach(item => {
                if (state.searchQuery && !item.name.toLowerCase().includes(state.searchQuery)) return;

                visibleCount++;

                const card = document.createElement("div");
                card.className = `board-card ${state.currentUser ? 'is-admin' : ''}`;
                card.id = `board-card-${item.id}`;

                card.innerHTML = `
                    <div class="board-header">
                        <div class="board-title-group">
                            <h2 class="board-title">${item.name}</h2>
                            <div class="board-admin-btns">
                                <button class="btn-board-edit">수정</button>
                                <button class="btn-board-delete">삭제</button>
                            </div>
                        </div>
                        <span class="board-badge">도장 ${item.count} / ${STAMPS_PER_BOARD}개</span>
                    </div>
                    <div class="stamp-grid"></div>
                `;

                const grid = card.querySelector('.stamp-grid');

                for (let s = 1; s <= STAMPS_PER_BOARD; s++) {
                    const btn = document.createElement("button");
                    btn.className = `stamp-btn${s % 3 === 0 ? ' special' : ''}${s <= item.count ? ' active' : ''}`;
                    
                    if (s <= item.count) {
                        btn.innerHTML = `<img src="Jerry.png" alt="도장" class="stamp-icon"><span class="stamp-number">${s}</span>`;
                    } else {
                        btn.innerHTML = `<span class="stamp-number">${s}</span>`;
                    }

                    btn.onclick = () => openModal(item.id, s, item.count);
                    grid.appendChild(btn);
                }

                const btnEdit = card.querySelector('.btn-board-edit');
                const btnDel = card.querySelector('.btn-board-delete');

                if (btnEdit) {
                    btnEdit.onclick = (e) => {
                        e.stopPropagation();
                        handleEditBoardPrompt(item.id, item.name, item.count);
                    };
                }
                if (btnDel) {
                    btnDel.onclick = (e) => {
                        e.stopPropagation();
                        handleDeleteBoard(item.id, item.name);
                    };
                }

                fragment.appendChild(card);
            });

            container.appendChild(fragment);

            if (visibleCount === 0) {
                noResultElem.textContent = `'${state.searchQuery}' 검색 결과와 일치하는 도장판이 없습니다.`;
                noResultElem.style.display = 'block';
            } else {
                noResultElem.style.display = 'none';
            }
        }

        function openModal(boardIndex, stampIndex, activeCount) {
            state.activeEditingStamp = { boardId: boardIndex, stampIndex };
            const key = `${boardIndex}-${stampIndex}`;
            const data = state.stamps[key] || {
                date: "날짜 정보 없음",
                text: "등록된 클립 정보가 없습니다.",
                url: ""
            };

            modalTitle.textContent = `${stampIndex}번 도장`;

            if (stampIndex <= activeCount) {
                modalDot.style.backgroundColor = (stampIndex % 3 === 0) ? "#b08968" : "#ff758f";
            } else {
                modalDot.style.backgroundColor = (stampIndex % 3 === 0) ? "#ede0d4" : "#ffe3ea";
            }

            if (state.currentUser) {
                modalViewMode.style.display = 'none';
                modalEditMode.style.display = 'flex';
                editStampDate.value = data.date.includes("없음") ? "" : data.date;
                editStampText.value = data.text.includes("없습니다") ? "" : data.text;
                editStampUrl.value = data.url || "";
            } else {
                modalViewMode.style.display = 'flex';
                modalEditMode.style.display = 'none';
                modalDate.textContent = data.date;
                modalText.textContent = data.text;

                if (data.url) {
                    modalLink.href = data.url;
                    modalLink.textContent = data.url.replace(/^https?:\/\//, "");
                    modalLink.style.display = "inline";
                } else {
                    modalLink.textContent = "링크 없음";
                    modalLink.removeAttribute("href");
                }
            }

            infoModal.style.display = "flex";
        }

        function closeModal() {
            infoModal.style.display = "none";
            state.activeEditingStamp = null;
        }

        async function saveStampData() {
            if (!state.currentUser || !state.activeEditingStamp) return;

            const { boardId, stampIndex } = state.activeEditingStamp;
            const key = `${boardId}-${stampIndex}`;

            const date = editStampDate.value.trim() || "날짜 정보 없음";
            const text = editStampText.value.trim() || "등록된 클립 정보가 없습니다.";
            const url = editStampUrl.value.trim();

            try {
                await setDoc(doc(db, "hotclips_stamps", key), { date, text, url });
                closeModal();
            } catch (err) {
                console.error("도장 정보 저장 실패:", err);
                alert("저장 중 오류가 발생했습니다: " + err.message);
            }
        }

        async function handleAddBoard() {
            if (!state.currentUser) {
                alert("관리자 로그인이 필요합니다.");
                return;
            }

            const name = prompt("새로 추가할 시청자 닉네임을 입력하세요:");
            if (!name || !name.trim()) return;

            const countStr = prompt("현재 획득한 도장 개수를 입력하세요 (0~30):", "0");
            const count = Math.min(STAMPS_PER_BOARD, Math.max(0, parseInt(countStr, 10) || 0));

            const numericIds = Object.keys(state.boards)
                .map(k => parseInt(k, 10))
                .filter(n => !isNaN(n));
            const newId = numericIds.length > 0 ? Math.max(...numericIds) + 1 : 1;

            try {
                await setDoc(doc(db, "hotclips_boards", String(newId)), {
                    name: name.trim(),
                    count: count
                });
            } catch (err) {
                console.error("도장판 생성 오류:", err);
                alert("도장판 생성 실패: " + err.message);
            }
        }

        async function handleEditBoardPrompt(id, currentName, currentCount) {
            const newName = prompt("수정할 닉네임을 입력하세요:", currentName);
            if (newName === null) return;

            const newCountStr = prompt("수정할 도장 개수를 입력하세요 (0~30):", currentCount);
            if (newCountStr === null) return;

            const count = Math.min(STAMPS_PER_BOARD, Math.max(0, parseInt(newCountStr, 10) || 0));

            try {
                await setDoc(doc(db, "hotclips_boards", String(id)), {
                    name: newName.trim() || currentName,
                    count: count
                });
            } catch (err) {
                console.error("도장판 수정 오류:", err);
                alert("도장판 수정 실패: " + err.message);
            }
        }

        async function handleDeleteBoard(id, name) {
            if (!confirm(`'${name}' 님의 도장판을 정말로 삭제하시겠습니까?`)) return;

            try {
                await deleteDoc(doc(db, "hotclips_boards", String(id)));
            } catch (err) {
                console.error("도장판 삭제 오류:", err);
                alert("도장판 삭제 실패: " + err.message);
            }
        }

        async function handleAuthToggle() {
            if (state.currentUser) {
                await signOut(auth);
            } else {
                const email = prompt("관리자 이메일을 입력하세요:");
                if (!email) return;
                const password = prompt("비밀번호를 입력하세요:");
                if (!password) return;

                try {
                    await signInWithEmailAndPassword(auth, email.trim(), password);
                } catch (error) {
                    alert("로그인 실패: 이메일 또는 비밀번호가 올바르지 않습니다.");
                }
            }
        }

        function setSortMode(mode) {
            state.currentSortMode = mode;
            Object.keys(sortButtons).forEach(k => sortButtons[k].classList.toggle('active', k === mode));
            renderBoards();
        }

        function init() {
            renderGoods();

            onAuthStateChanged(auth, user => {
                state.currentUser = user;
                authBtn.textContent = user ? "로그아웃" : "관리자 로그인";
                authBtn.classList.toggle('logged-in', !!user);
                adminControlsBar.classList.toggle('active', !!user);
                renderGoods();
                renderBoards();
            });

            onSnapshot(collection(db, "hotclips_goods"), snapshot => {
                if (snapshot.empty) {
                    state.goods = defaultGoodsList;
                    if (state.currentUser) {
                        defaultGoodsList.forEach(g => setDoc(doc(db, "hotclips_goods", String(g.id)), g));
                    }
                } else {
                    const loadedGoods = [];
                    snapshot.forEach(docSnap => loadedGoods.push(docSnap.data()));
                    loadedGoods.sort((a, b) => a.id - b.id);
                    state.goods = loadedGoods;
                }
                renderGoods();
            });

            onSnapshot(collection(db, "hotclips_boards"), snapshot => {
                if (snapshot.empty) {
                    state.boards = defaultBoards;
                    if (state.currentUser) {
                        Object.entries(defaultBoards).forEach(([id, bData]) => setDoc(doc(db, "hotclips_boards", id), bData));
                    }
                } else {
                    const newBoards = {};
                    snapshot.forEach(docSnap => { newBoards[docSnap.id] = docSnap.data(); });
                    state.boards = newBoards;
                }
                renderBoards();
            });

            onSnapshot(collection(db, "hotclips_stamps"), snapshot => {
                const newStamps = {};
                snapshot.forEach(docSnap => { newStamps[docSnap.id] = docSnap.data(); });
                state.stamps = newStamps;
                renderBoards();
            });

            authBtn.addEventListener('click', handleAuthToggle);
            btnAddBoard.addEventListener('click', handleAddBoard);
            btnSaveStamp.addEventListener('click', saveStampData);
            btnSaveGoods.addEventListener('click', saveGoodsData);

            nicknameSearch.addEventListener('input', (e) => {
                state.searchQuery = e.target.value.trim().toLowerCase();
                renderBoards();
            });

            Object.entries(sortButtons).forEach(([mode, btn]) => {
                btn.addEventListener('click', () => setSortMode(mode));
            });

            modalCloseIcon.addEventListener('click', closeModal);
            infoModal.addEventListener('click', (e) => { if (e.target === infoModal) closeModal(); });

            goodsModalCloseIcon.addEventListener('click', closeGoodsEditModal);
            goodsEditModal.addEventListener('click', (e) => { if (e.target === goodsEditModal) closeGoodsEditModal(); });

            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                    closeGoodsEditModal();
                }
            });
        }

        init();
    </script>
</body>
</html>
