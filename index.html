<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다정현네 체리창고</title>
    
    <style>
        /* [전체 배경 및 레이아웃] */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fff0f3;
            color: #4a4a4a;
            margin: 0;
            padding: 60px 20px; /* 상하 여백 확대 */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;          /* 카드 사이 간격 확대 */
        }

        /* [메인 카드 스타일] */
        .container {
            background: #ffffff;
            max-width: 900px;   /* 너비 확장 (기존 600px -> 900px) */
            width: 100%;
            padding: 45px;      /* 내부 여백 확장 */
            border-radius: 20px;
            border: 1px solid #ffccd5;
            box-shadow: 0 10px 25px rgba(255, 117, 143, 0.15);
            text-align: center;
            box-sizing: border-box;
        }

        /* [이미지 스타일] */
        .profile-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 24px;
            border-radius: 16px;
            border: 4px solid #ff758f;
        }

        /* [메인 제목 폰트 확대] */
        h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: #c9184a;
        }

        /* [본문 텍스트 확대] */
        p {
            font-size: 18px;
            line-height: 1.6;
            color: #595959;
            margin-bottom: 28px;
        }

        /* [버튼 크기 확대] */
        .action-button {
            background-color: #ff758f;
            color: #ffffff;
            border: none;
            padding: 14px 36px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .action-button:hover {
            background-color: #ff4d6d;
        }

        .action-button:active {
            transform: scale(0.98);
        }

        #result-text {
            margin-top: 24px;
            font-size: 18px;
            font-weight: 600;
            color: #a4133c;
        }

        /* [하단 서브 카드 스타일] */
        .sub-container {
            background: #ffffff;
            max-width: 900px;   /* 너비 일치 */
            width: 100%;
            padding: 35px 45px;
            border-radius: 20px;
            border: 1px solid #ffccd5;
            box-shadow: 0 6px 20px rgba(255, 117, 143, 0.1);
            box-sizing: border-box;
        }

        .sub-title {
            font-size: 22px;
            color: #c9184a;
            margin: 0 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #fff0f3;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-button {
            display: block;
            padding: 16px;
            text-align: center;
            background-color: #fff0f3;
            color: #c9184a;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            transition: background-color 0.2s;
        }

        .link-button:hover {
            background-color: #ffccd5;
        }
    </style>
</head>
<body>

    <!-- 1. 상단 메인 프로필 카드 -->
    <div class="container">
        <img src="my-image.png" alt="프로필 사진" class="profile-img">
        <h1>다정현 핫클립</h1>
        <p>이번주 핫클립이에용.</p>
        
        <button class="action-button" onclick="handleButtonClick()">클릭해보기</button>
        <div id="result-text"></div>
    </div>

    <!-- 2. 하단 활동 및 링크 카드 -->
    <div class="sub-container">
        <h2 class="sub-title">활동 및 링크</h2>
        <div class="link-list">
            <a href="https://github.com" target="_blank" class="link-button">GitHub 프로필 바로가기</a>
            <a href="https://youtube.com" target="_blank" class="link-button">유튜브 채널 바로가기</a>
        </div>
    </div>

    <!-- 3. 하단 공지사항 카드 -->
    <div class="sub-container">
        <h2 class="sub-title">공지사항</h2>
        <p style="font-size: 16px; color: #666; margin: 0; line-height: 1.6;">
            웹사이트를 지속적으로 업데이트하고 있습니다. 방문해 주셔서 감사합니다.
        </p>
    </div>

    <script>
        let clickCount = 0;

        function handleButtonClick() {
            clickCount += 1;
            const outputElement = document.getElementById("result-text");
            outputElement.textContent = `버튼을 ${clickCount}번 클릭했습니다.`;
        }
    </script>
</body>
</html>
