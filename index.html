<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다정현네 체리창고</title>
    
    <style>
        /* [전체 페이지 배경 및 정렬] */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fff0f3;
            color: #4a4a4a;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* [공통 카드 컨테이너 스타일] */
        .container, .board-card {
            background: #ffffff;
            max-width: 900px;
            width: 100%;
            padding: 35px 40px;
            border-radius: 20px;
            border: 1px solid #ffccd5;
            box-shadow: 0 8px 20px rgba(255, 117, 143, 0.12);
            box-sizing: border-box;
        }

        .container {
            text-align: center;
        }

        /* [상단 배너/프로필 이미지] */
        .profile-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 20px;
            border-radius: 16px;
            border: 4px solid #ff758f;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #c9184a;
        }

        /* [도장판 헤더 영역] */
        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #fff0f3;
        }

        .board-title {
            font-size: 20px;
            font-weight: bold;
            color: #c9184a;
            margin: 0;
        }

        .board-badge {
            font-size: 13px;
            font-weight: bold;
            color: #ff4d6d;
            background-color: #fff0f3;
            padding: 6px 12px;
            border-radius: 20px;
        }

        /* [도장판 30칸 그리드 (가로 10칸)] */
        .stamp-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
        }

        /* 모바일 대응 (가로 5칸) */
        @media (max-width: 768px) {
            .stamp-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        /* [도장 기본 상태 (미달성 회색 칸)] */
        .stamp-btn {
            position: relative;
            aspect-ratio: 1 / 1;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            transition: all 0.15s ease-in-out;
            overflow: hidden;
        }

        .stamp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* [도장 칸 내부의 Jerry 이미지 스타일] */
        .stamp-icon {
            width: 70%;
            height: 70%;
            object-fit: contain;
            pointer-events: none;
        }

        /* [도장 획득 상태 (일반 - 분홍색)] */
        .stamp-btn.active {
            background-color: #ffe5ec;
            border-color: #ff8fa3;
        }

        /* [도장 획득 상태 (3의 배수 보상 칸 - 초코색)] */
        .stamp-btn.active.special {
            background-color: #ede0d4;
            border-color: #b08968;
        }

        /* 도장 번호 라벨 */
        .stamp-number {
            position: absolute;
            bottom: 3px;
            right: 5px;
            font-size: 10px;
            color: #888888;
            font-weight: 500;
        }

        /* [상세 정보 모달 팝업] */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-box {
            background: #ffffff;
            max-width: 360px;
            width: 100%;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            position: relative;
            text-align: left;
        }

        .modal-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title-dot {
            width: 10px;
            height: 10px;
            background-color: #60a5fa;
            border-radius: 50%;
            display: inline-block;
        }

        .modal-title-text {
            font-size: 18px;
            font-weight: bold;
            color: #1f2937;
        }

        .modal-close-icon {
            width: 28px;
            height: 28px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #6b7280;
            font-size: 14px;
            line-height: 1;
            padding: 0;
            transition: background 0.15s;
        }

        .modal-close-icon:hover {
            background: #e5e7eb;
            color: #111827;
        }

        .modal-item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 15px;
            color: #374151;
        }

        .modal-item {
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-all;
        }

        .modal-item-icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        .modal-item-link {
            color: #2563eb;
            text-decoration: none;
        }

        .modal-item-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- 1. 상단 프로필/배너 메인 카드 -->
    <div class="container">
        <img src="my-image.png" alt="프로필 사진" class="profile-img">
        <h1>다정현 핫클립 저장소</h1>
        <p style="margin: 0; color: #666; font-size: 16px;">원하는 도장을 클릭하여 상세 클립 정보를 확인하세요.</p>
    </div>

    <!-- 2. 아래로 생성될 20개의 도장판 영역 -->
    <div id="boards-container" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 28px;"></div>

    <!-- 3. 도장 클릭 시 노출되는 모달 창 -->
    <div class="modal-overlay" id="info-modal" onclick="closeModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header-row">
                <div class="modal-title-group">
                    <span class="title-dot"></span>
                    <span class="modal-title-text" id="modal-title">1번 도장</span>
                </div>
                <button class="modal-close-icon" onclick="closeModalDirect()">✕</button>
            </div>

            <div class="modal-item-list">
                <div class="modal-item">
                    <span class="modal-item-icon">🗓️</span>
                    <span id="modal-date">2026. 8. 31.</span>
                </div>
                <div class="modal-item">
                    <span class="modal-item-icon">💭</span>
                    <span id="modal-text">클립 정보가 없습니다.</span>
                </div>
                <div class="modal-item">
                    <span class="modal-item-icon">🎬</span>
                    <a href="#" id="modal-link" target="_blank" class="modal-item-link">링크 바로가기</a>
                </div>
            </div>
        </div>
    </div>

    <!-- [스크립트 로직] -->
    <script>
        const totalBoards = 20;     // 생성할 총 도장판 개수
        const stampsPerBoard = 30;   // 각 판당 칸 수

        // ========================================================
        // [1. 도장판 이름(닉네임/타이틀) 관리]
        // ========================================================
        const boardNames = {
            1: "르나이라",
            2: "라면먹은찹쌀이",
            3: "메론딸기푸딩"
            // 지정하지 않은 번호는 기본값(도장판 #번호)으로 자동 표시됩니다.
        };

        // ========================================================
        // [2. 도장판별 활성화(색칠) 개수 설정]
        // ========================================================
        const boardActiveCounts = {
            1: 3,
            2: 1,
            3: 0
        };

        // ========================================================
        // [3. 도장별 세부 데이터 관리]
        // "도장판번호-도장번호": { date: "날짜", text: "문구", url: "링크" }
        // ========================================================
        const stampData = {
            // [1번 도장판]
            "1-1": {
                date: "2026. 8. 31.",
                text: "26.08 [반캠] 업보청산",
                url: "https://chzzk.naver.com/clips/Jk7KNdlKcs"
            },
            "1-2": {
                date: "2026. 8. 31.",
                text: "26.08 [저챗] 마음과 뇌의 싸움",
                url: "https://chzzk.naver.com/clips/bp72a4teVq"
            },
            "1-3": {
                date: "2026. 8. 31.",
                text: "26.08 [마크] 폭탄 추격전",
                url: "https://chzzk.naver.com/clips/MiojMHRjVm"
            },

            // [2번 도장판]
            "2-1": {
                date: "2026. 8. 31.",
                text: "26.08 [T1] 버른살의 애교",
                url: "https://chzzk.naver.com/clips/iam0ruNKlk"
            }
        };

        // 20개 도장판 생성 함수
        function initBoards() {
            const container = document.getElementById("boards-container");
            container.innerHTML = "";

            for (let b = 1; b <= totalBoards; b++) {
                const card = document.createElement("div");
                card.className = "board-card";

                const activeCount = boardActiveCounts[b] || 0;
                // boardNames에 등록된 이름이 있으면 사용, 없으면 '도장판 #번호' 사용
                const currentBoardTitle = boardNames[b] || `도장판 #${b}`;

                // 상단 타이틀 및 달성 배지
                const header = document.createElement("div");
                header.className = "board-header";
                header.innerHTML = `
                    <h2 class="board-title">${currentBoardTitle}</h2>
                    <span class="board-badge">도장 ${activeCount} / ${stampsPerBoard}개</span>
                `;
                card.appendChild(header);

                // 도장 그리드 생성
                const grid = document.createElement("div");
                grid.className = "stamp-grid";

                for (let s = 1; s <= stampsPerBoard; s++) {
                    const btn = document.createElement("button");
                    btn.className = "stamp-btn";

                    // 3의 배수는 special 클래스 부여
                    if (s % 3 === 0) {
                        btn.classList.add("special");
                    }

                    // 활성화 번호 이하는 Jerry 이미지 출력
                    if (s <= activeCount) {
                        btn.classList.add("active");
                        btn.innerHTML = `<img src="Jerry.png" alt="도장" class="stamp-icon"><span class="stamp-number">${s}</span>`;
                    } else {
                        btn.innerHTML = `<span class="stamp-number">${s}</span>`;
                    }

                    btn.onclick = () => openModal(b, s);
                    grid.appendChild(btn);
                }

                card.appendChild(grid);
                container.appendChild(card);
            }
        }

        // 모달 데이터 노출
        function openModal(boardIndex, stampIndex) {
            const key = `${boardIndex}-${stampIndex}`;
            const data = stampData[key] || {
                date: "날짜 정보 없음",
                text: "등록된 클립 정보가 없습니다.",
                url: ""
            };

            document.getElementById("modal-title").textContent = `${stampIndex}번 도장`;
            document.getElementById("modal-date").textContent = data.date;
            document.getElementById("modal-text").textContent = data.text;

            const linkElem = document.getElementById("modal-link");
            if (data.url) {
                linkElem.href = data.url;
                linkElem.textContent = data.url.replace(/^https?:\/\//, "");
                linkElem.style.display = "inline";
            } else {
                linkElem.textContent = "링크 없음";
                linkElem.removeAttribute("href");
            }

            document.getElementById("info-modal").style.display = "flex";
        }

        // 모달 닫기
        function closeModal(event) {
            if (event.target.id === "info-modal") {
                document.getElementById("info-modal").style.display = "none";
            }
        }

        function closeModalDirect() {
            document.getElementById("info-modal").style.display = "none";
        }

        window.addEventListener("DOMContentLoaded", initBoards);
    </script>
</body>
</html>
