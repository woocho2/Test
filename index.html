<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단한 소개 웹사이트</title>
    
    <style>
        /* 기본 배경: 부드러운 연분홍 톤 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fff0f3;
            color: #4a4a4a;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        /* 중앙 카드: 은은한 분홍 그림자와 연한 분홍 테두리 적용 */
        .container {
            background: #ffffff;
            max-width: 500px;
            width: 100%;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #ffccd5;
            box-shadow: 0 8px 20px rgba(255, 117, 143, 0.15);
            text-align: center;
        }

        /* 제목: 짙은 로즈 핑크 */
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #c9184a;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #595959;
            margin-bottom: 24px;
        }

        /* 버튼: 화사한 핑크 톤 */
        .action-button {
            background-color: #ff758f;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        /* 마우스 호버 시 더 진한 핑크로 변경 */
        .action-button:hover {
            background-color: #ff4d6d;
        }

        /* 클릭 순간 살짝 눌리는 효과 */
        .action-button:active {
            transform: scale(0.98);
        }

        /* 카운트 결과 텍스트: 선명한 딥 핑크 */
        #result-text {
            margin-top: 20px;
            font-size: 16px;
            font-weight: 600;
            color: #a4133c;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>안녕하세요</h1>
        <p>간단한 HTML, CSS, JavaScript로 구성된 단일 페이지 웹사이트입니다.</p>
        
        <button class="action-button" onclick="handleButtonClick()">클릭해보기</button>
        
        <div id="result-text"></div>
    </div>

    <script>
        // 클릭 횟수 저장 변수
        let clickCount = 0;

        // 버튼 클릭 시 호출되는 함수
        function handleButtonClick() {
            clickCount += 1;
            const outputElement = document.getElementById("result-text");
            outputElement.textContent = `버튼을 ${clickCount}번 클릭했습니다.`;
        }
    </script>
</body>
</html>
